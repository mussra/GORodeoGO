name: Tests GUT por trozos
on:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          R=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sL -o g.zip $R/Godot_v4.7.2-stable_linux.x86_64.zip && unzip -qo g.zip && chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Importar y ejecutar cada script con limite de tiempo
        run: |
          G="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$G" --headless --path . --import > /dev/null 2>&1 || true
          ls tests/unit/*.gd tests/integration/*.gd | sort > all.txt
          awk -v s=${{ matrix.shard }} 'NR%8==s' all.txt > mine.txt
          : > result.txt
          while read f; do
            n=$(basename "$f" .gd)
            out=$(timeout 150 "$G" --headless --path . -s addons/gut/gut_cmdln.gd -gselect="$n" -gexit 2>&1); rc=$?
            if [ $rc -eq 124 ]; then echo "TIMEOUT $n" >> result.txt
            elif echo "$out" | grep -a -q "All tests passed"; then echo "PASS $n" >> result.txt
            else echo "FAIL $n" >> result.txt; fi
          done < mine.txt
          echo "== shard ${{ matrix.shard }}"; sort result.txt | cut -d' ' -f1 | uniq -c; grep -a -v '^PASS' result.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ matrix.shard }}
          path: result.txt
