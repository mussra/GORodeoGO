name: AAB de prueba (sin firma de subida)
on:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          R=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sL -o g.zip $R/Godot_v4.7.2-stable_linux.x86_64.zip && unzip -qo g.zip && chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Importar y ejecutar cada script con limite de tiempo
        run: |
          set +e
          G="$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$G" --headless --path . --import > /dev/null 2>&1 || true
          ls tests/unit/*.gd tests/integration/*.gd | sort > all.txt
          awk -v s=${{ matrix.shard }} 'NR%8==s' all.txt > mine.txt
          : > result.txt
          while read f; do
            n=$(basename "$f" .gd)
            out=$(timeout 150 "$G" --headless --path . -s addons/gut/gut_cmdln.gd -gselect="$n" -gexit 2>&1); rc=$?
            if [ $rc -eq 124 ]; then echo "TIMEOUT $n" >> result.txt
            elif echo "$out" | grep -a -q "All tests passed"; then echo "PASS $n" >> result.txt
            else echo "FAIL $n" >> result.txt; fi
          done < mine.txt
          echo "== shard ${{ matrix.shard }}"; sort result.txt | cut -d' ' -f1 | uniq -c; grep -a -v '^PASS' result.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ matrix.shard }}
          path: result.txt
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Godot y plantillas
        run: |
          R=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sL -o g.zip $R/Godot_v4.7.2-stable_linux.x86_64.zip && unzip -qo g.zip && chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -sL -o t.zip $R/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/tp
          unzip -qo t.zip 'templates/android*' 'templates/version.txt' -d /tmp/tp
          cp /tmp/tp/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Plantilla Android
        run: |
          mkdir -p android/build
          unzip -q -o "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip" -d android/build
          cp "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt" android/.build_version
          touch android/build/.gdignore
      - name: Clave temporal (se sustituye por la de subida fuera de GitHub)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/tmp.jks" -alias tmp -keyalg RSA -keysize 2048 -validity 100 -storepass temporal123 -keypass temporal123 -dname "CN=tmp"
      - name: Importar y exportar AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/tmp.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tmp
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: temporal123
        run: |
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --import || true
          mkdir -p BIN
          "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --export-release "Android Play" "$PWD/BIN/GoRodeoGo-Play-unsigned.aab"
          ls -la BIN
      - uses: actions/upload-artifact@v4
        with:
          name: GoRodeoGo-Play-aab
          path: BIN/GoRodeoGo-Play-unsigned.aab
